<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>eVAS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" sizes="180x180" href="https://tmwctanaka.github.io/evas-icon/apple-touch-icon.png">
<link rel="apple-touch-icon" href="https://tmwctanaka.github.io/evas-icon/apple-touch-icon.png">
<link rel="icon" type="image/png" href="https://tmwctanaka.github.io/evas-icon/apple-touch-icon.png">

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background: #f4f8fb;
}

.wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
}

.card {
  text-align: center;
  padding: 32px;
}

h1 {
  font-size: 40px;
  color: #2f3b45;
  margin-bottom: 16px;
}

p {
  font-size: 20px;
  color: #555;
  margin-bottom: 28px;
}

a.button {
  display: inline-block;
  font-size: 24px;
  font-weight: bold;
  color: white;
  background: #2f80d0;
  padding: 16px 32px;
  border-radius: 12px;
  text-decoration: none;
}
</style>
</head>

<body>
<div class="wrapper">
  <div class="card">
    <h1>eVAS</h1>
    <p>疼痛評価アプリを起動します。</p>
    <a class="button" href="https://script.google.com/macros/s/AKfycbxMsy1AWitxus1LrSToAvjAV3GZeVOtsxJfjeBaO-cFR6wcVMro2wAjCFKgSYjC2cjJ4w/exec">
      eVASを開く
    </a>
  </div>
</div>

<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbxMsy1AWitxus1LrSToAvjAV3GZeVOtsxJfjeBaO-cFR6wcVMro2wAjCFKgSYjC2cjJ4w/exec";

// ホーム画面アイコンから起動された場合のみ、自動でApps Scriptへ移動する。
// Safariで通常表示しているときは移動しないため、ホーム画面追加時にGitHub Pages側のアイコンを拾いやすい。
const isStandalone =
  window.navigator.standalone === true ||
  window.matchMedia("(display-mode: standalone)").matches;

if (isStandalone) {
  window.location.replace(APP_URL);
}
</script>

</body>
</html>
